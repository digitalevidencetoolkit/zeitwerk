[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "zeitwerk"
version = "0.1.0"
description = "RFC 3161-spirited timestamping with OpenTimestamps-compatible receipts"
requires-python = ">=3.11"
dependencies = ["opentimestamps"]

[tool.setuptools]
packages = ["zeitwerk"]
