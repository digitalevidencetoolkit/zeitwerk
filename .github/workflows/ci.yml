name: CI
on:
  push: { branches: [main] }
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - run: pip install -e submodules/python-opentimestamps
      - run: pip install -e .
      - run: python -m unittest discover tests -v
      - run: python -O -m unittest discover tests   # guards the -O __lt__ hazard
